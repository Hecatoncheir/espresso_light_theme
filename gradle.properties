# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = com.github.hecatoncheir.espressolight
pluginName = Espresso Light Theme
# SemVer format -> https://semver.org
pluginVersion = 1.4.1

# Supported build number ranges and IntelliJ Platform versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
pluginSinceBuild = 191.0
# Left empty on purpose: a pure theme plugin has no code bound to a platform API,
# so the `until-build` constraint is dropped and the plugin stays compatible with future IDEs.
pluginUntilBuild =

# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-gradle-intellij-plugin.html#intellij-extension
platformType = IC
platformVersion = 2021.3.3

# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
# Example: platformPlugins = com.intellij.java, com.jetbrains.php:203.4449.22
platformPlugins =

# IDE versions runPluginVerifier checks the plugin against. 2019.1 is the oldest
# release pluginSinceBuild claims to support (build 191); without it that claim
# is never actually tested. Widen the list as new IDE releases appear.
pluginVerifierIdeVersions = 2019.1.4, 2021.3.3, 2023.3.8, 2025.2.6

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion = 7.5.1
