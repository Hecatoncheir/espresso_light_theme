name: Release

# Publishing is driven by GitHub Releases: draft a release, and publishing it
# uploads the plugin to JetBrains Marketplace. Nothing is published on a plain
# push. Requires a PUBLISH_TOKEN repository secret (Marketplace -> My Tokens);
# CERTIFICATE_CHAIN / PRIVATE_KEY / PRIVATE_KEY_PASSWORD are optional and only
# needed if you sign the plugin.
on:
  release:
    types: [prereleased, released]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to Marketplace
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # IntelliJ Platform 2025.2 (build 252) requires Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      # Only a release event carries a tag to upload to; a manual run publishes
      # to Marketplace and stops there.
      - name: Attach the distribution to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/distributions/*.zip --clobber
