name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two JDKs on purpose: the Gradle toolchain in build.gradle.kts asks for 11,
      # and setup-java points JAVA_HOME at the last entry, so the daemon runs on 17.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            11
            17

      - uses: gradle/actions/setup-gradle@v4

      # buildPlugin runs patchPluginXml, so a malformed README description
      # section or a broken CHANGELOG fails here. verifyPlugin then checks the
      # plugin.xml and the bundled theme descriptors.
      - name: Build plugin
        run: ./gradlew buildPlugin verifyPlugin

      # Structural checks for the theme descriptors. Every rule in there maps to
      # a bug that shipped at least once; tools/check_theme.py explains which.
      - name: Check theme descriptors
        run: python3 tools/check_theme.py

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: build/distributions/*.zip

  # Runs the JetBrains Plugin Verifier against the IDE releases listed in
  # gradle.properties. Separate job: it downloads a full IDE per version, so it
  # is far slower than the build and should not hold it up.
  verify:
    name: Plugin verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two JDKs on purpose: the Gradle toolchain in build.gradle.kts asks for 11,
      # and setup-java points JAVA_HOME at the last entry, so the daemon runs on 17.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            11
            17

      - uses: gradle/actions/setup-gradle@v4

      # The verifier unpacks each IDE under ~/.pluginVerifier/ides
      # (RunPluginVerifierTask.ideDownloadDir).
      - name: Cache downloaded IDEs
        uses: actions/cache@v4
        with:
          path: ~/.pluginVerifier/ides
          key: plugin-verifier-${{ hashFiles('gradle.properties') }}
          restore-keys: plugin-verifier-

      - name: Run plugin verifier
        run: ./gradlew runPluginVerifier

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier
