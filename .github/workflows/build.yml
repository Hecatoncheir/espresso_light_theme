name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # IntelliJ Platform 2025.2 (build 252) requires Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # buildPlugin patches plugin.xml, so a malformed README description section
      # or a broken CHANGELOG fails here. The two verify tasks are the cheap ones:
      # verifyPlugin itself downloads a full IDE per version and runs in its own job.
      - name: Build plugin
        run: ./gradlew buildPlugin verifyPluginStructure verifyPluginProjectConfiguration

      # Structural checks for the theme descriptors. Every rule in there maps to
      # a bug that shipped at least once; tools/check_theme.py explains which.
      - name: Check theme descriptors
        run: python3 tools/check_theme.py

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: build/distributions/*.zip

  # Runs the JetBrains Plugin Verifier against the IDE releases listed in
  # gradle.properties. Separate job: it downloads a full IDE per version, so it
  # is far slower than the build and should not hold it up.
  verify:
    name: Plugin verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # IntelliJ Platform 2025.2 (build 252) requires Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # 2.x keeps downloaded IDEs in the project-local cache directory
      # (Constants.CACHE_DIRECTORY / CACHE_DIRECTORY_IDES).
      - name: Cache downloaded IDEs
        uses: actions/cache@v4
        with:
          path: .intellijPlatform/ides
          key: plugin-verifier-${{ hashFiles('gradle.properties') }}
          restore-keys: plugin-verifier-

      - name: Run plugin verifier
        run: ./gradlew verifyPlugin

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier
